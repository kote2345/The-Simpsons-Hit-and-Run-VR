plugins {
    id 'com.android.application'
}

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "com.simpsonsHitAndRun.vr"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 93
        versionName "0.93"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24",
                        //"-DANDROID_STL=c++_static",
                        "-DANDROID_STL=c++_shared",
                        "-DANDROID=ON",
                        "-DSRR2_BUILD_TESTS=OFF",
                        "-DSRR2_REGION=PAL",
                        "-DSRR2_VR_RENDERER=${project.findProperty('vrRenderer') ?: 'VULKAN'}"
                // Meta Quest standalone devices are arm64-only.
                abiFilters 'arm64-v8a'

            }
        }


        //ndk {
            //noinspection ChromeOsAbiSupport
            //abiFilters 'armeabi-v7a', 'arm64-v8a'

       // }

    }

    // Vulkan is the primary Quest/PCVR renderer. GLES can still be selected
    // explicitly during migration with: -PvrRenderer=GLES

    // ✅ CAMBIO 1: Activar Prefab para poder consumir AARs con paquetes C/C++ (como com.fpliu...:ffmpeg)
    buildFeatures {
        prefab true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Keep native/Java Release optimizations while producing an APK
            // that can be installed directly during Quest development.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
        releaseWithLogs {
            initWith release
            debuggable true
            jniDebuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir 'libs'
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //implementation 'com.github.tanersener:ffmpeg-kit:v4.5.LTS'
    implementation 'com.fpliu.ndk.pkg.prefab.android.21:ffmpeg:6.0'
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.61'
}
